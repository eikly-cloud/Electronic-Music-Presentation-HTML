name: Import presentation assets
on:
  push:
    paths:
      - '.github/import-assets.zip'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and verify the presentation
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          root = pathlib.Path.cwd()
          with zipfile.ZipFile('.github/import-assets.zip') as archive:
              for item in archive.infolist():
                  destination = (root / item.filename).resolve()
                  assert destination.is_relative_to(root / 'dist'), item.filename
              archive.extractall(root)
          expected = json.loads(pathlib.Path('.github/import-manifest.json').read_text())
          actual = sorted(str(p.relative_to(root)) for p in (root / 'dist').rglob('*') if p.is_file())
          assert actual == sorted(item['path'] for item in expected), 'File list mismatch'
          for item in expected:
              assert hashlib.sha256((root / item['path']).read_bytes()).hexdigest() == item['sha256'], item['path']
          print('Verified all', len(expected), 'presentation files')
          PY
      - name: Commit complete project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git rm .github/import-assets.zip .github/import-manifest.json
          git commit -m "Complete presentation asset import (304 verified files)"
          git push
